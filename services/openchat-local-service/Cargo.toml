[package]
name = "openchat-local-service"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "openchat_local_service"
path = "src/lib.rs"

[[bin]]
name = "openchat-local-service"
path = "src/main.rs"

[features]
storage-broker-test-support = []
desktop-profile-test-support = []

[dependencies]
age = "=0.12.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled-sqlcipher-vendored-openssl", "functions"] }
dirs = "6.0"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream", "gzip", "brotli"] }
# OpenCode free-tier inference requires a TLS ClientHello that `rustls` cannot
# produce (it has no CBC or static-RSA suites), so those requests use OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-openssl = { version = "0.10", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls-native-certs = "0.8"
ring = "0.17.14"
sha2 = "0.10"
similar = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
http = "1"
sse-stream = "0.2.6"
ignore = "=0.4.33"
rayon = "1.12.0"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.2.4"
htmd = "0.5.5"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
usearch = "2.26.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zeroize = "=1.8.1"
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"

[target.'cfg(not(windows))'.dependencies]
# The interactive terminal uses these process wrappers only outside Windows.
process-wrap = { version = "=10.0.1", default-features = false, features = ["kill-on-drop", "process-group", "tokio1"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
rmcp = { version = "=3.0.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["copy-dylibs"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Wdk_Storage_FileSystem",
] }
