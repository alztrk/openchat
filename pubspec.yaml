name: openchat
description: "A cross-platform AI chat application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  drift: 2.35.0
  drift_flutter: 0.3.1
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: ^2.2.3
  flutter_widget_from_html_core: 0.17.4
  html: 0.15.7
  intl: any
  markdown: 7.3.1
  shared_preferences: ^2.5.5
  toastification: 3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.0
  build_runner: ^2.16.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/conversation/
    - assets/icons/dark/
    - assets/icons/window/light/
    - assets/icons/window/dark/
    - assets/brand/light/
    - assets/brand/dark/
    - brand/variants/openchat-horizontal.svg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
