name: openchat
description: "A cross-platform AI chat application."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.13.1

dependencies:
  drift: 2.35.0
  drift_flutter: 0.3.1
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: ^2.2.3
  flutter_widget_from_html_core: 0.17.4
  html: 0.15.7
  intl: any
  markdown: 7.3.1
  sqlite3: 3.5.2
  shared_preferences: ^2.5.5
  toastification: 3.2.0
  lucide_icons_flutter: 3.1.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.0
  build_runner: ^2.16.1
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/engines/
    - assets/icons/conversation/
    - assets/icons/dark/
    - assets/icons/window/light/
    - assets/icons/window/dark/
    - assets/brand/light/
    - assets/brand/dark/
    - brand/variants/openchat-horizontal.svg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3VF-Upright.ttf
          weight: 700
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodeVF-Upright.ttf
          weight: 400
        - asset: assets/fonts/SourceCodeVF-Upright.ttf
          weight: 600
