name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  linux-validate:
    name: Linux validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Linux validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

  linux-packages:
    name: Linux Tauri packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-draft
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run openchat -- build ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '--preview' }}
        working-directory: apps/desktop/frontend

      - name: Prepare Linux packages
        run: |
          mkdir -p release-artifacts/linux
          cp target/release/bundle/deb/*.deb release-artifacts/linux/
          cp target/release/bundle/appimage/*.AppImage release-artifacts/linux/

      - name: Upload Linux packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/linux/* --clobber

  macos-packages:
    name: macOS ${{ matrix.arch }} package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run openchat -- build ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '--preview' }}
        working-directory: apps/desktop/frontend

      - name: Prepare macOS package
        run: |
          mkdir -p "release-artifacts/macos-${{ matrix.arch }}"
          cp target/release/bundle/dmg/*.dmg "release-artifacts/macos-${{ matrix.arch }}/"

      - name: Upload macOS package to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "release-artifacts/macos-${{ matrix.arch }}"/* --clobber

  windows-validate:
    name: Windows validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install RustSec dependency auditor
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependency lockfile
        run: cargo audit

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Run local validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

      - name: Check Rust API documentation
        run: |
          cargo rustdoc -p openchat-local-service --locked --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
          cargo rustdoc -p openchat-desktop --locked --bin openchat-desktop -- -D missing-docs -D rustdoc::broken_intra_doc_links

      - name: Reject unused Rust dependencies
        run: |
          cargo rustc -p openchat-local-service --lib --locked -- -D unused_crate_dependencies
          cargo rustc -p openchat-desktop --bin openchat-desktop --locked -- -D unused_crate_dependencies

      - name: Reject production panic paths in local service
        run: cargo clippy -p openchat-local-service --lib --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Reject production panic paths in Tauri host
        run: cargo clippy -p openchat-desktop --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  windows-installer:
    name: Windows Tauri installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-draft
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows signing certificate
        id: windows-signing-certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/signing/import-windows-certificate.ps1
        shell: pwsh

      - name: Build the Windows installer
        env:
          OPENCHAT_WINDOWS_SIGNING_THUMBPRINT: ${{ steps.windows-signing-certificate.outputs.thumbprint }}
        run: npm run openchat -- build ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '--preview' }}
        working-directory: apps/desktop/frontend

      - name: Verify signed Windows application and installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source -First 1
          if (-not $signTool) {
            $windowsKitsDirectory = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            if (Test-Path -LiteralPath $windowsKitsDirectory) {
              $signTool = Get-ChildItem -LiteralPath $windowsKitsDirectory -Directory |
                Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
                Sort-Object { [version]$_.Name } -Descending |
                ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
                Where-Object { Test-Path -LiteralPath $_ } |
                Select-Object -First 1
            }
          }
          if (-not $signTool) {
            throw 'SignTool.exe was not found on PATH or in the installed Windows SDK.'
          }
          $signedFiles = @(
            Get-Item target/release/openchat-desktop.exe
            Get-ChildItem target/release/bundle/nsis/*-setup.exe -File
          )
          if ($signedFiles.Count -lt 2) {
            throw 'The Windows build did not produce both the application executable and NSIS installer.'
          }
          foreach ($file in $signedFiles) {
            & $signTool verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($file.Name)."
            }
          }
        shell: pwsh

      - name: Prepare Windows installer
        run: |
          New-Item -ItemType Directory -Force release-artifacts/windows | Out-Null
          Copy-Item -Path target/release/bundle/nsis/*-setup.exe -Destination release-artifacts/windows/
        shell: pwsh

      - name: Remove Windows signing certificate from runner
        if: always() && steps.windows-signing-certificate.outcome == 'success'
        env:
          OPENCHAT_WINDOWS_SIGNING_THUMBPRINT: ${{ steps.windows-signing-certificate.outputs.thumbprint }}
        run: ./scripts/signing/remove-windows-certificate.ps1 -Thumbprint $env:OPENCHAT_WINDOWS_SIGNING_THUMBPRINT
        shell: pwsh

      - name: Upload Windows installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installerPaths = @(Get-ChildItem -Path release-artifacts/windows/*-setup.exe -File | ForEach-Object FullName)
          if ($installerPaths.Count -eq 0) {
            throw 'The NSIS installer artifact is missing.'
          }
          & gh release upload "$env:GITHUB_REF_NAME" @installerPaths --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'The NSIS installer could not be uploaded to the draft release.'
          }
        shell: pwsh

  sbom:
    name: Generate source SBOM
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Prepare SBOM output directory
        run: mkdir --parents release-artifacts/sbom

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/sbom/OpenChat-SBOM.spdx.json
          syft-version: v1.57.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM
        run: node scripts/validate-sbom.mjs release-artifacts/sbom/OpenChat-SBOM.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-SBOM
          path: release-artifacts/sbom/OpenChat-SBOM.spdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release-draft:
    name: Create unpublished stable draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-validate
      - windows-validate
      - sbom
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Create or reuse an unpublished stable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != "true" ]]; then
              echo "The tag already has a published release and cannot be overwritten by CI." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi

  release:
    name: Complete unpublished stable draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-packages
      - windows-installer
      - macos-packages
      - sbom
      - release-draft
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-SBOM
          path: release-artifacts/sbom

      - name: Add SBOM and checksums to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/publish
          gh release download "$GITHUB_REF_NAME" --dir release-artifacts/publish
          rm -f -- \
            release-artifacts/publish/SHA256SUMS \
            release-artifacts/publish/OpenChat-SBOM.spdx.json
          cp release-artifacts/sbom/OpenChat-SBOM.spdx.json release-artifacts/publish/
          test -n "$(find release-artifacts/publish -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-artifacts/publish -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find release-artifacts/publish -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          dmg_count=$(find release-artifacts/publish -maxdepth 1 -type f -name '*.dmg' | wc -l)
          if [[ "$dmg_count" -lt 2 ]]; then
            echo "Both macOS architecture packages are required." >&2
            exit 1
          fi
          node scripts/release-integrity.mjs aggregate release-artifacts/publish
          gh release upload "$GITHUB_REF_NAME" \
            release-artifacts/publish/OpenChat-SBOM.spdx.json \
            release-artifacts/publish/SHA256SUMS \
            --clobber
