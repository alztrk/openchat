name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  linux-validate:
    name: Linux validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Linux validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

  linux-packages:
    name: Linux Tauri packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run openchat -- build ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '--preview' }}
        working-directory: apps/desktop/frontend

      - name: Prepare and checksum Linux packages
        run: |
          mkdir -p release-artifacts/linux
          cp target/release/bundle/deb/*.deb release-artifacts/linux/
          cp target/release/bundle/appimage/*.AppImage release-artifacts/linux/
          node scripts/release-integrity.mjs create release-artifacts/linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Linux-packages
          path: release-artifacts/linux
          if-no-files-found: error
          retention-days: 14

  windows-validate:
    name: Windows validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install RustSec dependency auditor
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependency lockfile
        run: cargo audit

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/desktop/frontend

      - name: Run local validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

      - name: Check Rust API documentation
        run: |
          cargo rustdoc -p openchat-local-service --locked --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
          cargo rustdoc -p openchat-desktop --locked --bin openchat-desktop -- -D missing-docs -D rustdoc::broken_intra_doc_links

      - name: Reject unused Rust dependencies
        run: |
          cargo rustc -p openchat-local-service --lib --locked -- -D unused_crate_dependencies
          cargo rustc -p openchat-desktop --bin openchat-desktop --locked -- -D unused_crate_dependencies

      - name: Reject production panic paths in local service
        run: cargo clippy -p openchat-local-service --lib --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Reject production panic paths in Tauri host
        run: cargo clippy -p openchat-desktop --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  windows-installer:
    name: Windows Tauri installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows signing certificate
        id: windows-signing-certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/signing/import-windows-certificate.ps1
        shell: pwsh

      - name: Build the Windows installer
        env:
          OPENCHAT_WINDOWS_SIGNING_THUMBPRINT: ${{ steps.windows-signing-certificate.outputs.thumbprint }}
        run: npm run openchat -- build ${{ startsWith(github.ref, 'refs/tags/v') && '--stable' || '--preview' }}
        working-directory: apps/desktop/frontend

      - name: Verify signed Windows application and installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $signedFiles = @(
            Get-Item target/release/openchat-desktop.exe
            Get-ChildItem target/release/bundle/nsis/*-setup.exe -File
          )
          if ($signedFiles.Count -lt 2) {
            throw 'The Windows build did not produce both the application executable and NSIS installer.'
          }
          foreach ($file in $signedFiles) {
            & $signTool verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $($file.Name)."
            }
          }
        shell: pwsh

      - name: Prepare and checksum Windows installer
        run: |
          New-Item -ItemType Directory -Force release-artifacts/windows | Out-Null
          Copy-Item -Path target/release/bundle/nsis/*-setup.exe -Destination release-artifacts/windows/
          node scripts/release-integrity.mjs create release-artifacts/windows
        shell: pwsh

      - name: Remove Windows signing certificate from runner
        if: always() && steps.windows-signing-certificate.outcome == 'success'
        env:
          OPENCHAT_WINDOWS_SIGNING_THUMBPRINT: ${{ steps.windows-signing-certificate.outputs.thumbprint }}
        run: ./scripts/signing/remove-windows-certificate.ps1 -Thumbprint $env:OPENCHAT_WINDOWS_SIGNING_THUMBPRINT
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Windows-installer
          path: release-artifacts/windows
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Generate source SBOM
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Prepare SBOM output directory
        run: mkdir --parents release-artifacts/sbom

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/sbom/OpenChat-SBOM.spdx.json
          syft-version: v1.57.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM
        run: node scripts/validate-sbom.mjs release-artifacts/sbom/OpenChat-SBOM.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-SBOM
          path: release-artifacts/sbom/OpenChat-SBOM.spdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: Publish stable or preview channel
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs:
      - linux-validate
      - linux-packages
      - windows-validate
      - windows-installer
      - sbom
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-Linux-packages
          path: release-artifacts/linux

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-Windows-installer
          path: release-artifacts/windows

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-SBOM
          path: release-artifacts/sbom

      - name: Verify package integrity and prepare release assets
        run: |
          node scripts/release-integrity.mjs verify release-artifacts/linux
          node scripts/release-integrity.mjs verify release-artifacts/windows
          mkdir -p release-artifacts/publish
          find release-artifacts/linux release-artifacts/windows -maxdepth 1 -type f ! -name SHA256SUMS -exec cp {} release-artifacts/publish/ \;
          cp release-artifacts/sbom/OpenChat-SBOM.spdx.json release-artifacts/publish/
          node scripts/release-integrity.mjs aggregate release-artifacts/publish

      - name: Publish stable or preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            release_tag="preview-${GITHUB_SHA}"
            gh release create "$release_tag" --prerelease --target "$GITHUB_SHA" --title "OpenChat Preview ${GITHUB_SHA:0:12}" --generate-notes release-artifacts/publish/*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release-artifacts/publish/*
          fi
