name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  linux-validate:
    name: Linux validation
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Linux validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

  linux-packages:
    name: Linux Tauri packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            librsvg2-bin \
            libdbus-1-dev \
            bubblewrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run openchat -- build
        working-directory: apps/desktop/frontend

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows-validate:
    name: Windows validation
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install RustSec dependency auditor
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependency lockfile
        run: cargo audit

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/desktop/frontend

      - name: Run local validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

      - name: Check Rust API documentation
        run: |
          cargo rustdoc -p openchat-local-service --locked --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
          cargo rustdoc -p openchat-desktop --locked --bin openchat-desktop -- -D missing-docs -D rustdoc::broken_intra_doc_links

      - name: Reject unused Rust dependencies
        run: |
          cargo rustc -p openchat-local-service --lib --locked -- -D unused_crate_dependencies
          cargo rustc -p openchat-desktop --bin openchat-desktop --locked -- -D unused_crate_dependencies

      - name: Reject production panic paths in local service
        run: cargo clippy -p openchat-local-service --lib --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Reject production panic paths in Tauri host
        run: cargo clippy -p openchat-desktop --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  windows-installer:
    name: Windows Tauri installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the local service sidecar
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc -p openchat-local-service --bin openchat-local-service
          New-Item -ItemType Directory -Force apps/desktop/tauri/binaries | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/openchat-local-service.exe -Destination apps/desktop/tauri/binaries/openchat-local-service-x86_64-pc-windows-msvc.exe -Force
        shell: pwsh

      - name: Build the Windows installer
        run: npm run tauri:build
        working-directory: apps/desktop/frontend

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows and Linux release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-validate
      - linux-packages
      - windows-validate
      - windows-installer
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-Linux-packages
          path: release-artifacts/linux

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenChat-Windows-installer
          path: release-artifacts/windows

      - name: Publish release with both platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          release-artifacts/linux/deb/*.deb
          release-artifacts/linux/appimage/*.AppImage
          release-artifacts/windows/*-setup.exe
