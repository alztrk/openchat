name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation and Tauri installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install RustSec dependency auditor
        run: cargo install --debug --locked --version 0.22.2 cargo-audit

      - name: Audit Rust dependency lockfile
        run: cargo audit

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/frontend

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/desktop/frontend

      - name: Format and lint the frontend
        run: npx biome check
        working-directory: apps/desktop/frontend

      - name: Test frontend rendering limits
        run: node --experimental-strip-types --test tests/virtualMessageLayout.test.mjs
        working-directory: apps/desktop/frontend

      - name: Check frontend types and build assets
        run: npm run build
        working-directory: apps/desktop/frontend

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust API documentation
        run: |
          cargo rustdoc -p openchat_service --locked --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
          cargo rustdoc -p openchat-desktop --locked --bin openchat-desktop -- -D missing-docs -D rustdoc::broken_intra_doc_links

      - name: Reject unused Rust dependencies
        run: |
          cargo rustc -p openchat_service --lib --locked -- -D unused_crate_dependencies
          cargo rustc -p openchat-desktop --bin openchat-desktop --locked -- -D unused_crate_dependencies

      - name: Reject production panic paths
        run: cargo clippy -p openchat_service --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Check and test native service
        run: |
          cargo check -p openchat_service --all-targets --locked
          cargo test -p openchat_service --locked -- --test-threads=1

      - name: Build the Tauri host
        run: cargo check -p openchat-desktop --locked

      - name: Test the Tauri host
        run: cargo test -p openchat-desktop --locked -- --test-threads=1

      - name: Lint the Tauri host
        run: cargo clippy -p openchat-desktop --all-targets --locked -- -D warnings

      - name: Reject production panic paths in Tauri host
        run: cargo clippy -p openchat-desktop --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Build the local service sidecar
        run: |
          cargo build --release --locked -p openchat_service
          New-Item -ItemType Directory -Force apps/desktop/tauri/binaries | Out-Null
          Copy-Item -LiteralPath target/release/openchat_service.exe -Destination apps/desktop/tauri/binaries/openchat_service-x86_64-pc-windows-msvc.exe -Force
        shell: pwsh

      - name: Build the Windows installer
        run: npm run tauri:build
        working-directory: apps/desktop/frontend

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenChat-Windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
