name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation and Tauri installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check frontend types and build assets
        run: npm run build
        working-directory: frontend

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path native/openchat-service/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check and test native service
        run: |
          cargo check --all-targets --locked --manifest-path native/openchat-service/Cargo.toml
          cargo test --locked --manifest-path native/openchat-service/Cargo.toml -- --test-threads=1

      - name: Build the Tauri host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the local service sidecar
        run: |
          cargo build --release --locked --manifest-path native/openchat-service/Cargo.toml
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath native/openchat-service/target/release/openchat_service.exe -Destination src-tauri/binaries/openchat_service-x86_64-pc-windows-msvc.exe -Force
        shell: pwsh

      - name: Build the Windows installer
        run: npm run tauri:build
        working-directory: frontend

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
