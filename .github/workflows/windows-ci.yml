name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation and Tauri installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install RustSec dependency auditor
        run: cargo install --debug --locked --version 0.22.2 cargo-audit

      - name: Audit Rust dependency lockfile
        run: cargo audit

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit
        working-directory: apps/desktop/frontend

      - name: Run local validation harness
        run: npm run openchat -- check
        working-directory: apps/desktop/frontend

      - name: Check Rust API documentation
        run: |
          cargo rustdoc -p openchat-local-service --locked --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
          cargo rustdoc -p openchat-desktop --locked --bin openchat-desktop -- -D missing-docs -D rustdoc::broken_intra_doc_links

      - name: Reject unused Rust dependencies
        run: |
          cargo rustc -p openchat-local-service --lib --locked -- -D unused_crate_dependencies
          cargo rustc -p openchat-desktop --bin openchat-desktop --locked -- -D unused_crate_dependencies

      - name: Reject production panic paths
        run: cargo clippy -p openchat-local-service --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Lint the Tauri host
        run: cargo clippy -p openchat-desktop --all-targets --locked -- -D warnings

      - name: Reject production panic paths in Tauri host
        run: cargo clippy -p openchat-desktop --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Build the local service sidecar
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc -p openchat-local-service --bin openchat-local-service
          New-Item -ItemType Directory -Force apps/desktop/tauri/binaries | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/openchat-local-service.exe -Destination apps/desktop/tauri/binaries/openchat-local-service-x86_64-pc-windows-msvc.exe -Force
        shell: pwsh

      - name: Build the Windows installer
        run: npm run tauri:build
        working-directory: apps/desktop/frontend

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenChat-Windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
