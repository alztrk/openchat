name: Engineering Task
description: Propose a product, engineering, reliability, release, or validation task.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Write every field in English. Search existing issues before creating a duplicate.
        Apply exactly one `type:*` label and one `area:*` label. Add a `priority:*` label only when priority is agreed.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the outcome this issue should deliver in one or two sentences.
      placeholder: Describe the concrete outcome.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the current behavior, problem, or reason this work is needed.
      placeholder: Describe the relevant context and impact.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Name the user-visible screen or workflow and the known code paths. Verify paths in the repository; write "To be confirmed" where the location is not yet known.
      placeholder: |
        - User-visible surface:
        - Runtime/platform:
        - Source paths:
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the observable behavior after this work is complete.
      placeholder: State what should happen and, where relevant, what should not happen.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List concrete, independently verifiable completion conditions.
      placeholder: |
        - [ ] Verify the primary success path.
        - [ ] Verify relevant failure, empty, or recovery paths.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Specify the tests, manual workflow, platform, profile, model, or package needed to verify the acceptance criteria.
      placeholder: Describe how each acceptance criterion will be checked.
    validations:
      required: true

  - type: textarea
    id: dependencies-and-constraints
    attributes:
      label: Dependencies and constraints
      description: Record prerequisites, blockers, platform limitations, and security or data constraints. Write "None known" when applicable.
      placeholder: None known.
    validations:
      required: true
