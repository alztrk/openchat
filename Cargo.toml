[workspace]
resolver = "3"
members = ["services/openchat-local-service", "apps/desktop/tauri"]

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"
