[workspace]
resolver = "3"
members = ["services/openchat-local-service", "apps/desktop/tauri"]
exclude = ["vendor/tiktoken"]

# Keep the tokenizer cache off Tokio's bounded worker stacks on Windows.
[patch.crates-io]
tiktoken = { path = "vendor/tiktoken" }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
codegen-units = 16
panic = "abort"
