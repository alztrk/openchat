<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F5F6" />
    <title>OpenChat</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow: hidden;
        background: #f4f5f6;
      }

      .startup-loading-page {
        display: grid;
        min-block-size: 100%;
        place-content: center;
        justify-items: center;
        gap: 0.5rem;
        padding: 1rem;
        background: #f4f5f6;
        color: #23272c;
        font-family: sans-serif;
      }

      .startup-loading-page__brand {
        font-size: 1.125rem;
        font-weight: 600;
      }

      .startup-loading-page__message {
        color: #56606a;
        font-size: 0.875rem;
      }

      .startup-loading-page__indicator {
        inline-size: 1.25rem;
        block-size: 1.25rem;
        margin-block-start: 0.5rem;
        border: 2px solid rgb(204 209 215 / 10%);
        border-inline-end-color: #8e563b;
        border-radius: 50%;
        animation: openchat-startup-spin 800ms linear infinite;
      }

      @keyframes openchat-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loading-page__indicator {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main aria-live="polite" class="startup-loading-page" role="status">
        <span class="startup-loading-page__brand">OpenChat</span>
        <span class="startup-loading-page__message">Starting OpenChat…</span>
        <span aria-hidden="true" class="startup-loading-page__indicator"></span>
      </main>
    </div>
    <script type="module" src="/src/bootstrap/main.tsx"></script>
  </body>
</html>
