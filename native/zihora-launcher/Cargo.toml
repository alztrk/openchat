[package]
name = "zihora_launcher"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
description = "Single-file Windows launcher for Zihora"

[dependencies]
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
sha2 = "0.10"
winres = "0.1.12"

[package.metadata.winres]
ProductName = "Zihora"
FileDescription = "Zihora portable application launcher"
OriginalFilename = "zihora.exe"
