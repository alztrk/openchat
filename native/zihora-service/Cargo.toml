[package]
name = "zihora_service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "stream"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.2.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
zeroize = "=1.8.1"
