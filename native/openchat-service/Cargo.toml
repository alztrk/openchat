[package]
name = "openchat_service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6.0"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "stream", "gzip", "brotli"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.2.4"
htmd = "0.5.5"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
usearch = "2.26.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["copy-dylibs"] }
zeroize = "=1.8.1"
