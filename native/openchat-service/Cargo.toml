[package]
name = "openchat_service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
age = "=0.12.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "functions"] }
dirs = "7.0"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls", "stream", "gzip", "brotli"] }
sha2 = "0.10"
similar = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
ignore = "=0.4.33"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1.2.4"
htmd = "0.5.5"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
usearch = "2.26.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["copy-dylibs"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
